name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coupling-portability-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/consolidate-green-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply reviewed portability repair
        run: python scripts/repair_ciel_coupling_portability.py

      - name: Commit portability repair
        run: |
          if git diff --quiet; then
            echo "No portability repair required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ciel_coupling.py
          git commit -m "Remove host-specific coupling paths"
          git push origin HEAD:${{ github.head_ref }}

  all-in-one-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install build
          python -m pip install -e .[dev] --no-deps

      - name: Compile canonical Python packages
        run: |
          python -m compileall -q src/ciel_sot_agent
          python -m compileall -q src/cielingo_core

      - name: Ruff canonical packages
        id: ruff
        run: |
          set +e
          set -o pipefail
          ruff check src/ciel_sot_agent src/cielingo_core tests/test_meaning_to_surface_compiler.py 2>&1 | tee ci-ruff.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Meaning compiler contract
        id: compiler
        env:
          PYTHONPATH: src
        run: |
          set +e
          set -o pipefail
          pytest -q --noconftest --junitxml=compiler-junit.xml tests/test_meaning_to_surface_compiler.py 2>&1 | tee compiler-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trace module identity mutations
        run: |
          python - <<'PY' > module-identity-scan.log
          from pathlib import Path

          needles = ("sys.modules", "noema_surface_mmap", "module_from_spec", "ModuleType")
          for root in (Path("tests"), Path("src"), Path("scripts")):
              for path in sorted(root.rglob("*.py")):
                  text = path.read_text(encoding="utf-8", errors="replace")
                  lines = text.splitlines()
                  hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
                  if not hits:
                      continue
                  print(f"### {path}")
                  emitted = set()
                  for hit in hits:
                      for i in range(max(0, hit - 2), min(len(lines), hit + 3)):
                          if i in emitted:
                              continue
                          emitted.add(i)
                          print(f"{i + 1:04d}: {lines[i]}")
                  print()
          print("### .github/workflows")
          for path in sorted(Path(".github/workflows").iterdir()):
              print(path.name)
          PY
          cat module-identity-scan.log

      - name: Repository test suite
        id: pytest
        run: |
          set +e
          set -o pipefail
          pytest --junitxml=repository-junit.xml 2>&1 | tee repository-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build wheel and verify clean installation
        id: wheel
        run: |
          set +e
          set -o pipefail
          {
            rm -rf build dist .wheel-venv
            python -m build --wheel
            python -m venv .wheel-venv
            .wheel-venv/bin/python -m pip install --upgrade pip
            .wheel-venv/bin/python -m pip install dist/*.whl
            .wheel-venv/bin/python - <<'PY'
          import ciel_sot_agent
          import cielingo
          import cielingo_core
          from cielingo_core.generation import MeaningToSurfaceCompiler

          assert ciel_sot_agent is not None
          assert cielingo is not None
          assert cielingo_core is not None
          assert MeaningToSurfaceCompiler is not None
          print("wheel_import_smoke=PASS")
          PY
          } 2>&1 | tee ci-wheel.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload all quality diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: all-in-one-quality-diagnostics
          path: |
            ci-ruff.log
            compiler-test.log
            compiler-junit.xml
            module-identity-scan.log
            repository-test.log
            repository-junit.xml
            ci-wheel.log
            dist/*.whl
          if-no-files-found: warn

      - name: Enforce quality ledger
        if: always()
        run: |
          echo "ruff=${{ steps.ruff.outputs.status }}"
          echo "compiler=${{ steps.compiler.outputs.status }}"
          echo "pytest=${{ steps.pytest.outputs.status }}"
          echo "wheel=${{ steps.wheel.outputs.status }}"
          test "${{ steps.ruff.outputs.status }}" = "0"
          test "${{ steps.compiler.outputs.status }}" = "0"
          test "${{ steps.pytest.outputs.status }}" = "0"
          test "${{ steps.wheel.outputs.status }}" = "0"
