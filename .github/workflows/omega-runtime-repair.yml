name: Omega Runtime Repair

on:
  push:
    branches: [agent/consolidate-green-ci]
    paths:
      - ".github/workflows/omega-runtime-repair.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/consolidate-green-ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply reviewed runtime integration
        run: python scripts/repair_omega_runtime_contracts.py

      - name: Remove temporary migration machinery
        run: |
          rm scripts/repair_omega_runtime_contracts.py
          rm .github/workflows/omega-runtime-repair.yml

      - name: Commit target state only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Omega orbital runtime policy"
          git push origin HEAD:agent/consolidate-green-ci
