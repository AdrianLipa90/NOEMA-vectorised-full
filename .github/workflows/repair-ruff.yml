name: Bounded Ruff Repair

on:
  push:
    branches: [agent/consolidate-green-ci]
    paths:
      - ".github/workflows/repair-ruff.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  safe-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/consolidate-green-ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.18

      - name: Apply only safe Ruff fixes
        run: ruff check --fix src/ciel_sot_agent src/cielingo_core tests/test_meaning_to_surface_compiler.py

      - name: Commit bounded repairs
        run: |
          # The autofixer is intentionally limited to Ruff's safe fix set.
          if git diff --quiet; then
            echo "No safe fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ciel_sot_agent src/cielingo_core tests/test_meaning_to_surface_compiler.py
          git commit -m "Apply safe Ruff repairs"
          git push origin HEAD:agent/consolidate-green-ci
