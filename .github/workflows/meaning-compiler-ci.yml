name: Meaning Compiler CI

on:
  pull_request:
    paths:
      - "src/cielingo_core/generation/**"
      - "src/cielingo_core/global_layer/contracts.py"
      - "tests/test_meaning_to_surface_compiler.py"
      - ".github/workflows/meaning-compiler-ci.yml"
  push:
    branches: [master]
    paths:
      - "src/cielingo_core/generation/**"
      - "src/cielingo_core/global_layer/contracts.py"
      - "tests/test_meaning_to_surface_compiler.py"
      - ".github/workflows/meaning-compiler-ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compiler-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install focused test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 ruff==0.15.18

      - name: Compile Python sources
        run: python -m compileall -q src/cielingo_core/generation

      - name: Ruff compiler surface
        run: |
          ruff check src/cielingo_core/generation
          ruff check tests/test_meaning_to_surface_compiler.py

      - name: Run compiler contract tests
        env:
          PYTHONPATH: src
        run: pytest -q --junitxml=compiler-junit.xml tests/test_meaning_to_surface_compiler.py

      - name: Upload compiler test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-junit
          path: compiler-junit.xml
          if-no-files-found: error
