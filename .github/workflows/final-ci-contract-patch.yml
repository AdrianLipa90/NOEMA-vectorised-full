name: Final CI Contract Patch

on:
  push:
    branches: [agent/consolidate-green-ci]
    paths:
      - ".github/workflows/final-ci-contract-patch.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/consolidate-green-ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply exact reviewed patch
        run: python scripts/final_ci_contract_patch.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/final_ci_contract_patch.py
          rm .github/workflows/final-ci-contract-patch.yml

      - name: Commit target state only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close final CI source contracts"
          git push origin HEAD:agent/consolidate-green-ci
